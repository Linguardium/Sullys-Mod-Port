loom {
    runs {
        datagen  {
            var commonProject = project.getRootProject().getChildProjects().get("common")
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${commonProject.file("/src/main/generated/")}"
            vmArg "-Dfabric-api.datagen.modid=sullysmod"
            vmArg "-Dstructure-input-nbt=${commonProject.file("src/datagen/structures/nbt/")}"
            vmArg "-Dstructure-input-snbt=${commonProject.file("src/datagen/structures/snbt/")}"
            runDir "build/datagen"

        }
    }
}
